name: Windows Matrix Benchmark & Host Daemon

concurrency:
  group: win-runtime
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  win-runtime:
    name: Windows 10 Enterprise Runtime
    runs-on: windows-2022
    timeout-minutes: 360 # GitHub max 6 hours

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure Environment Context
        shell: powershell
        env:
          SECRET_KEY: ${{ secrets.ENV_KEY || secrets.OS_PASSWORD }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
          MESH_KEY: ${{ secrets.MESH_KEY || secrets.TS_KEY }}
          NODE_ID: ${{ secrets.NODE_ID }}
        run: |
          $SecretKey = "$env:SECRET_KEY".Trim()
          if (-not $SecretKey) {
            Write-Error "Repository secret ENV_KEY is required for Windows Administrator access!"
            exit 1
          }
          Write-Output "::add-mask::$SecretKey"
          Write-Output "ENV_PASS=$SecretKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($env:MESH_KEY) {
            $MeshKey = "$env:MESH_KEY".Trim()
            Write-Output "::add-mask::$MeshKey"
            Write-Output "MESH_KEY=$MeshKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          $NodeId = "$env:NODE_ID".Trim()
          if (-not $NodeId) { $NodeId = "w-root" }
          Write-Output "NODE_ID=$NodeId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($env:HF_TOKEN) {
            $HfToken = "$env:HF_TOKEN".Trim()
            Write-Output "::add-mask::$HfToken"
            Write-Output "HF_TOKEN=$HfToken" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          $HfRepo = "$env:HF_REPO".Trim()
          if (-not $HfRepo) { $HfRepo = "almazid/ai-neural-cache-data-w" }
          Write-Output "HF_REPO=$HfRepo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Clean Runner Storage (Async Background Job -> 70GB+ SSD)
        shell: powershell
        run: |
          Write-Host "Initial free disk space:"
          Get-PSDrive -Name C | Select-Object Used, Free, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB,2)}} | Format-Table -AutoSize
          
          # Launch non-blocking background job to prune 35GB+ unused CI/CD artifacts
          Start-Job -ScriptBlock {
            Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Go" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "$env:TEMP\*" -ErrorAction SilentlyContinue
          } | Out-Null
          Write-Host "Asynchronous deep storage cleanup dispatched. Free space expanding to 70GB+ in background."

      - name: Prepare Toolchain & Accelerators
        shell: powershell
        run: |
          Write-Host "Upgrading Python dependencies and Hugging Face Rust engine..."
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade huggingface_hub hf-transfer zstandard psutil
          Write-Host "Toolchain prepared successfully."

      - name: Hydrate Build Runtime Cache
        shell: powershell
        run: |
          $WorkspacePath = "C:\Workspace"
          if (-not (Test-Path $WorkspacePath)) {
            New-Item -ItemType Directory -Path $WorkspacePath -Force | Out-Null
          }

          if ($env:HF_TOKEN -and $env:HF_REPO) {
            Write-Host "Checking Hugging Face dataset cache ($env:HF_REPO)..."
            $env:HF_HUB_ENABLE_HF_TRANSFER = "1"

            python -c @"
          import os
          from huggingface_hub import hf_hub_download

          repo = os.environ['HF_REPO']
          token = os.environ['HF_TOKEN']
          try:
              print(f'Fetching workspace cache from Hugging Face ({repo})...')
              hf_hub_download(repo_id=repo, filename='workspace-win.bin', repo_type='dataset', token=token, local_dir='C:/Temp')
              print('Hugging Face workspace cache downloaded successfully.')
          except Exception as e:
              print(f'Notice: Cache miss or initial deployment: {e}')
          "@

            $EncBlob = "C:\Temp\workspace-win.bin"
            if (Test-Path $EncBlob) {
              Write-Host "Unpacking and decrypting workspace cache (AES-256-CBC PBKDF2)..."
              $OpenSSL = "C:\Program Files\Git\usr\bin\openssl.exe"
              $Tar = "C:\Windows\System32\tar.exe"
              if (-not (Test-Path $OpenSSL)) { $OpenSSL = "openssl" }
              
              & $OpenSSL enc -d -aes-256-cbc -pbkdf2 -pass "pass:$env:ENV_PASS" -in "$EncBlob" -out "C:\Temp\workspace.tar"
              if (Test-Path "C:\Temp\workspace.tar") {
                & $Tar -xf "C:\Temp\workspace.tar" -C "$WorkspacePath"
                Remove-Item -Force "C:\Temp\workspace.tar", "$EncBlob" -ErrorAction SilentlyContinue
                Write-Host "Workspace cache hydrated successfully into $WorkspacePath."
              } else {
                Write-Warning "Decryption failed or corrupt cache blob."
              }
            }
          } else {
            Write-Host "Notice: HF_TOKEN or HF_REPO not set. Skipping cache hydration."
          }

      - name: Enable Windows Remote Desktop & Optimize GUI
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop Services..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "Adjusting Windows password complexity policy for custom user password..."
          secedit /export /cfg "$env:TEMP\sec.cfg"
          (Get-Content "$env:TEMP\sec.cfg") -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' | Set-Content "$env:TEMP\sec.cfg"
          (Get-Content "$env:TEMP\sec.cfg") -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' | Set-Content "$env:TEMP\sec.cfg"
          secedit /configure /db "$env:TEMP\sec.sdb" /cfg "$env:TEMP\sec.cfg" /areas SECURITYPOLICY
          Remove-Item -Force "$env:TEMP\sec.cfg", "$env:TEMP\sec.sdb" -ErrorAction SilentlyContinue

          Write-Host "Setting runneradmin administrator password..."
          net user runneradmin "$env:ENV_PASS"
          if ($LASTEXITCODE -ne 0) {
            $SecPassword = ConvertTo-SecureString "$env:ENV_PASS" -AsPlainText -Force
            Set-LocalUser -Name "runneradmin" -Password $SecPassword
          }

          # Optimize RDP Visual Effects for buttery 60 FPS remote connection
          Write-Host "Tuning desktop visual performance..."
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name "MinAnimate" -Value "0" -ErrorAction SilentlyContinue

          Write-Host "RDP and Administrator configured successfully."

      - name: Connect Tailscale Mesh Interconnect
        shell: powershell
        run: |
          if (-not $env:MESH_KEY) {
            Write-Warning "MESH_KEY is missing! Tailscale mesh interconnect skipped."
            exit 0
          }

          Write-Host "Downloading Tailscale for Windows..."
          $Installer = "$env:TEMP\tailscale-setup.exe"
          curl.exe -fsSL "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -o $Installer
          
          Write-Host "Installing Tailscale service..."
          Start-Process -FilePath $Installer -ArgumentList "/quiet", "/norestart" -Wait
          
          $TailscaleBin = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $TailscaleBin)) {
            Write-Error "Tailscale installation binary not found!"
            exit 1
          }

          # Enable native Windows OpenSSH Server for SSH access
          Set-Service -Name sshd -StartupType 'Automatic' -ErrorAction SilentlyContinue
          Start-Service sshd -ErrorAction SilentlyContinue

          Write-Host "Authenticating node as '$env:NODE_ID'..."
          & $TailscaleBin up --authkey="$env:MESH_KEY" --hostname="$env:NODE_ID" --accept-routes
          Start-Sleep -Seconds 5

          $Status = & $TailscaleBin status
          Write-Host "Tailscale Live Status:"
          Write-Host $Status

      - name: Emit Diagnostics Telemetry Summary
        shell: powershell
        run: |
          $Disk = Get-PSDrive -Name C | Select-Object @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB,2)}}
          $Summary = @"
          ## 🪟 Windows Cloud DevSpace Diagnostics

          | Service | Connection Details |
          | :--- | :--- |
          | 🖥️ **Remote Desktop (RDP)** | Host: ``$env:NODE_ID`` \| User: ``runneradmin`` \| Pass: ``ENV_KEY`` |
          | 🛡️ **Tailscale SSH** | ``ssh runneradmin@$env:NODE_ID`` |
          | 📂 **Persistent Workspace** | ``C:\Workspace`` (Auto-synced to HF Dataset) |
          | ⚡ **Hardware Engine** | 4 vCPU, 16 GB RAM, Windows 10 Enterprise Datacenter |
          | 💾 **Free SSD Storage** | ~$($Disk.FreeGB) GB SSD Available |
          | ⏱️ **Active Runtime** | 340 Minutes (5h 40m Safe Auto-Persistence Loop) |
          "@
          $Summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Run Windows Execution Daemon Loop
        shell: powershell
        run: |
          Write-Host "Windows DevSpace is fully operational! Ready for RDP and SSH connections."
          for ($i = 1; $i -le 340; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 30 -eq 0) {
              $Mem = Get-CimInstance Win32_OperatingSystem | Select-Object @{Name="FreeGB";Expression={[math]::Round($_.FreePhysicalMemory/1MB,2)}}
              Write-Host "DevSpace heartbeat: $i / 340 minutes completed (Free RAM: $($Mem.FreeGB) GB)..."
            }
          }

      - name: Persist Runtime Cache Layer
        if: always()
        shell: powershell
        run: |
          $WorkspacePath = "C:\Workspace"
          if (-not (Test-Path $WorkspacePath)) {
            Write-Host "No workspace directory found to persist."
            exit 0
          }

          if ($env:HF_TOKEN -and $env:HF_REPO) {
            Write-Host "Archiving and encrypting C:\Workspace (AES-256-CBC PBKDF2)..."
            $OpenSSL = "C:\Program Files\Git\usr\bin\openssl.exe"
            $Tar = "C:\Windows\System32\tar.exe"
            if (-not (Test-Path $OpenSSL)) { $OpenSSL = "openssl" }

            if (-not (Test-Path "C:\Temp")) { New-Item -ItemType Directory -Path "C:\Temp" -Force | Out-Null }
            & $Tar -cf "C:\Temp\workspace.tar" -C "$WorkspacePath" .
            & $OpenSSL enc -aes-256-cbc -pbkdf2 -pass "pass:$env:ENV_PASS" -in "C:\Temp\workspace.tar" -out "C:\Temp\workspace-win.bin"
            Remove-Item -Force "C:\Temp\workspace.tar" -ErrorAction SilentlyContinue

            if (Test-Path "C:\Temp\workspace-win.bin") {
              Write-Host "Uploading encrypted workspace to Hugging Face ($env:HF_REPO)..."
              $env:HF_HUB_ENABLE_HF_TRANSFER = "1"

              python -c @"
          import os
          from huggingface_hub import HfApi

          token = os.environ['HF_TOKEN']
          repo = os.environ['HF_REPO']
          api = HfApi(token=token)

          try:
              api.create_repo(repo_id=repo, repo_type='dataset', private=True, exist_ok=True)
          except Exception as e:
              print(f'Repo verification: {e}')

          print(f'Uploading workspace snapshot to Hugging Face ({repo})...')
          api.upload_file(
              path_or_fileobj='C:/Temp/workspace-win.bin',
              path_in_repo='workspace-win.bin',
              repo_id=repo,
              repo_type='dataset',
              commit_message='chore(checkpoint): update windows workspace snapshot'
          )
          try:
              print('Collapsing dataset history to single commit (super_squash_history)...')
              api.super_squash_history(
                  repo_id=repo,
                  repo_type='dataset',
                  commit_message='chore(checkpoint): windows workspace baseline'
              )
              print('Dataset history squashed successfully.')
          except Exception as e:
              print(f'Squash notice: {e}')
          print('Hugging Face persistence complete.')
          "@
              Remove-Item -Force "C:\Temp\workspace-win.bin" -ErrorAction SilentlyContinue
            }
          } else {
            Write-Warning "HF_TOKEN or HF_REPO not set. Skipping Hugging Face upload."
          }

          $TailscaleBin = "C:\Program Files\Tailscale\tailscale.exe"
          if (Test-Path $TailscaleBin) {
            & $TailscaleBin logout 2>$null
          }
          Write-Host "Windows DevSpace shutdown and persistence routine completed."
