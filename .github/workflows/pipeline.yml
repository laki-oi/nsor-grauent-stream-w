name: Distributed Neural Tensor Pipeline Daemon

concurrency:
  group: tensor-runtime
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tensor-pipeline:
    name: Distributed Matrix Compute Engine
    runs-on: windows-2022
    timeout-minutes: 360 # GitHub max 6 hours

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure Environment Context
        shell: powershell
        env:
          SECRET_KEY: ${{ secrets.ENV_KEY || secrets.OS_PASSWORD }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
          MESH_KEY: ${{ secrets.MESH_KEY || secrets.TS_KEY }}
          NODE_ID: ${{ secrets.NODE_ID }}
        run: |
          $SecretKey = "$env:SECRET_KEY".Trim()
          if (-not $SecretKey) {
            Write-Error "Repository secret ENV_KEY is required for Windows Administrator access!"
            exit 1
          }
          Write-Output "::add-mask::$SecretKey"
          Write-Output "ENV_PASS=$SecretKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($env:MESH_KEY) {
            $MeshKey = "$env:MESH_KEY".Trim()
            Write-Output "::add-mask::$MeshKey"
            Write-Output "MESH_KEY=$MeshKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          $NodeId = "$env:NODE_ID".Trim()
          if (-not $NodeId) { $NodeId = "w-root" }
          Write-Output "NODE_ID=$NodeId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($env:HF_TOKEN) {
            $HfToken = "$env:HF_TOKEN".Trim()
            Write-Output "::add-mask::$HfToken"
            Write-Output "HF_TOKEN=$HfToken" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          $HfRepo = "$env:HF_REPO".Trim()
          if (-not $HfRepo) { $HfRepo = "almazid/ai-neural-cache-data-w" }
          Write-Output "HF_REPO=$HfRepo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Clean Runner Storage (Async Background Job -> 70GB+ SSD)
        shell: powershell
        run: |
          Write-Host "Initial free disk space:"
          Get-PSDrive -Name C | Select-Object Used, Free, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB,2)}} | Format-Table -AutoSize
          
          # Launch non-blocking background job to prune 35GB+ unused CI/CD artifacts
          Start-Job -ScriptBlock {
            Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Go" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "$env:TEMP\*" -ErrorAction SilentlyContinue
          } | Out-Null
          Write-Host "Asynchronous deep storage cleanup dispatched. Free space expanding to 70GB+ in background."

      - name: Prepare Toolchain Dependencies
        shell: powershell
        run: |
          Write-Host "Installing high-speed Python compression and Hugging Face accelerators..."
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade huggingface_hub hf-transfer zstandard psutil
          Write-Host "Toolchain prepared successfully."

      - name: Install Sandboxie-Plus Kernel Engine
        shell: powershell
        run: |
          Write-Host "Installing Sandboxie-Plus silently via Chocolatey..."
          choco install sandboxie-plus -y --no-progress
          
          $SbiePath = "C:\Program Files\Sandboxie-Plus"
          if (-not (Test-Path "$SbiePath\Start.exe")) {
            Write-Error "Sandboxie-Plus installation failed!"
            exit 1
          }

          # Ensure Sandboxie driver service is running
          Start-Service SbieSvc -ErrorAction SilentlyContinue
          Write-Host "Sandboxie-Plus kernel engine active."

      - name: Configure Root App Compartment Architecture
        shell: powershell
        run: |
          $SbieIni = "C:\Windows\Sandboxie.ini"
          $Config = @"
          [GlobalSettings]
          FileRootPath=C:\RootEnv\%SANDBOX%

          [RootEnv]
          Enabled=y
          NoSecurityIsolation=y
          NoSecurityFiltering=y
          DropAdminRights=n
          BoxNameTitle=n
          AutoRecover=n
          "@
          Set-Content -Path $SbieIni -Value $Config -Encoding ascii
          Copy-Item $SbieIni "C:\Program Files\Sandboxie-Plus\Sandboxie.ini" -Force -ErrorAction SilentlyContinue

          # Ensure base directory exists
          if (-not (Test-Path "C:\RootEnv\RootEnv")) {
            New-Item -ItemType Directory -Path "C:\RootEnv\RootEnv" -Force | Out-Null
          }
          Write-Host "Root App Compartment configured at C:\RootEnv\RootEnv."

      - name: Hydrate RootEnv Cache Layer
        shell: powershell
        run: |
          if ($env:HF_TOKEN -and $env:HF_REPO) {
            Write-Host "Checking Hugging Face dataset cache ($env:HF_REPO)..."
            $env:HF_HUB_ENABLE_HF_TRANSFER = "1"

            if (-not (Test-Path "C:\Temp")) { New-Item -ItemType Directory -Path "C:\Temp" -Force | Out-Null }

            python -c @"
          import os
          from huggingface_hub import hf_hub_download

          repo = os.environ['HF_REPO']
          token = os.environ['HF_TOKEN']
          try:
              print(f'Fetching root environment layer from Hugging Face ({repo})...')
              hf_hub_download(repo_id=repo, filename='rootenv.bin', repo_type='dataset', token=token, local_dir='C:/Temp')
              print('RootEnv artifact fetched successfully.')
          except Exception as e:
              print(f'Notice: Cache miss or initial deployment: {e}')
          "@

            $EncBlob = "C:\Temp\rootenv.bin"
            if (Test-Path $EncBlob) {
              Write-Host "Decrypting and extracting RootEnv layer (AES-256-CBC + Zstd)..."
              $OpenSSL = "C:\Program Files\Git\usr\bin\openssl.exe"
              if (-not (Test-Path $OpenSSL)) { $OpenSSL = "openssl" }

              & $OpenSSL enc -d -aes-256-cbc -pbkdf2 -pass "pass:$env:ENV_PASS" -in "$EncBlob" -out "C:\Temp\rootenv.tar.zst"
              if (Test-Path "C:\Temp\rootenv.tar.zst") {
                python -c @"
          import zstandard as zstd, tarfile, os
          dctx = zstd.ZstdDecompressor()
          with open('C:/Temp/rootenv.tar.zst', 'rb') as f_in:
              with dctx.stream_reader(f_in) as decompressor:
                  with tarfile.open(fileobj=decompressor, mode='r|') as tar:
                      tar.extractall('C:/RootEnv/RootEnv')
          print('RootEnv hydration complete.')
          "@
                Remove-Item -Force "C:\Temp\rootenv.tar.zst", "$EncBlob" -ErrorAction SilentlyContinue
                Write-Host "RootEnv hydrated successfully."
              } else {
                Write-Warning "Decryption failed or corrupted cache blob."
              }
            }
          } else {
            Write-Host "Notice: HF_TOKEN or HF_REPO not set. Skipping cache hydration."
          }

      - name: Deploy Desktop Launchers & Remote Desktop
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop Services..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "Adjusting Windows password complexity policy for custom user password..."
          secedit /export /cfg "$env:TEMP\sec.cfg"
          (Get-Content "$env:TEMP\sec.cfg") -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' | Set-Content "$env:TEMP\sec.cfg"
          (Get-Content "$env:TEMP\sec.cfg") -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' | Set-Content "$env:TEMP\sec.cfg"
          secedit /configure /db "$env:TEMP\sec.sdb" /cfg "$env:TEMP\sec.cfg" /areas SECURITYPOLICY
          Remove-Item -Force "$env:TEMP\sec.cfg", "$env:TEMP\sec.sdb" -ErrorAction SilentlyContinue

          Write-Host "Setting runneradmin administrator password..."
          net user runneradmin "$env:ENV_PASS"
          if ($LASTEXITCODE -ne 0) {
            $SecPassword = ConvertTo-SecureString "$env:ENV_PASS" -AsPlainText -Force
            Set-LocalUser -Name "runneradmin" -Password $SecPassword
          }

          # Optimize visual performance for 60 FPS RDP
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name "MinAnimate" -Value "0" -ErrorAction SilentlyContinue

          # Create Desktop shortcuts for RootEnv
          $WshShell = New-Object -ComObject WScript.Shell
          $DesktopPath = [System.IO.Path]::Combine($env:USERPROFILE, "Desktop")
          if (-not (Test-Path $DesktopPath)) { New-Item -ItemType Directory -Path $DesktopPath -Force | Out-Null }

          # 1. RootEnv Explorer Shortcut
          $Shortcut1 = $WshShell.CreateShortcut("$DesktopPath\Launch_RootEnv_Explorer.lnk")
          $Shortcut1.TargetPath = "C:\Program Files\Sandboxie-Plus\Start.exe"
          $Shortcut1.Arguments = '/box:RootEnv explorer.exe "C:\"'
          $Shortcut1.WorkingDirectory = "C:\"
          $Shortcut1.Description = "Open Root Administrator Overlay Explorer"
          $Shortcut1.Save()

          # 2. RootEnv Terminal Shortcut
          $Shortcut2 = $WshShell.CreateShortcut("$DesktopPath\Launch_RootEnv_Terminal.lnk")
          $Shortcut2.TargetPath = "C:\Program Files\Sandboxie-Plus\Start.exe"
          $Shortcut2.Arguments = '/box:RootEnv powershell.exe'
          $Shortcut2.WorkingDirectory = "C:\"
          $Shortcut2.Description = "Open Root Administrator Overlay PowerShell"
          $Shortcut2.Save()

          # 3. Direct Storage Folder Shortcut
          $Shortcut3 = $WshShell.CreateShortcut("$DesktopPath\Persistent_Storage_RootEnv.lnk")
          $Shortcut3.TargetPath = "C:\RootEnv\RootEnv"
          $Shortcut3.Save()

          Write-Host "Desktop Launchers and RDP configured successfully."

      - name: Connect Tailscale Mesh Interconnect
        shell: powershell
        run: |
          if (-not $env:MESH_KEY) {
            Write-Warning "MESH_KEY is missing! Tailscale mesh interconnect skipped."
            exit 0
          }

          Write-Host "Downloading Tailscale for Windows..."
          $Installer = "$env:TEMP\tailscale-setup.exe"
          curl.exe -fsSL "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -o $Installer
          
          Write-Host "Installing Tailscale service..."
          Start-Process -FilePath $Installer -ArgumentList "/quiet", "/norestart" -Wait
          
          $TailscaleBin = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $TailscaleBin)) {
            Write-Error "Tailscale installation binary not found!"
            exit 1
          }

          Write-Host "Authenticating node as '$env:NODE_ID'..."
          & $TailscaleBin up --authkey="$env:MESH_KEY" --hostname="$env:NODE_ID" --accept-routes
          Start-Sleep -Seconds 5

          $Status = & $TailscaleBin status
          Write-Host "Tailscale Live Status:"
          Write-Host $Status

      - name: Emit Diagnostics Telemetry Summary
        shell: powershell
        run: |
          $Disk = Get-PSDrive -Name C | Select-Object @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB,2)}}
          $Summary = @"
          ## 🪟 Windows Cloud DevSpace Diagnostics (RootEnv App Compartment)

          | Service | Connection Details |
          | :--- | :--- |
          | 🖥️ **Remote Desktop (RDP)** | Host: ``$env:NODE_ID`` \| User: ``runneradmin`` \| Pass: ``ENV_KEY`` |
          | 🛡️ **App Compartment Mode** | Sandboxie-Plus OverlayFS (100% Root / NoSecurityIsolation) |
          | 📂 **Persistent Overlay Root** | ``C:\RootEnv\RootEnv`` (Auto-synced to HF Dataset) |
          | 🚀 **Desktop Launchers** | ``🚀 Launch RootEnv Explorer`` & ``⚡ Launch RootEnv Terminal`` |
          | ⚡ **Hardware Engine** | 4 vCPU, 16 GB RAM, Windows 10 Enterprise Datacenter |
          | 💾 **Free SSD Storage** | ~$($Disk.FreeGB) GB SSD Available |
          | ⏱️ **Active Runtime** | 340 Minutes (5h 40m Safe Auto-Persistence Loop) |
          "@
          $Summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Run Windows Execution Daemon Loop
        shell: powershell
        run: |
          Write-Host "Windows DevSpace is fully operational! Connect via RDP or Tailscale."
          for ($i = 1; $i -le 340; $i++) {
            Start-Sleep -Seconds 60
            $Mem = Get-CimInstance Win32_OperatingSystem | Select-Object @{Name="FreeGB";Expression={[math]::Round($_.FreePhysicalMemory/1MB,2)}}
            Write-Host "DevSpace heartbeat: $i / 340 minutes active (Free RAM: $($Mem.FreeGB) GB)..."
          }

      - name: Persist Runtime Cache Layer
        if: always()
        shell: powershell
        run: |
          Write-Host "Terminating active RootEnv processes gracefully..."
          $SbieCtrl = "C:\Program Files\Sandboxie-Plus\SbieCtrl.exe"
          if (Test-Path $SbieCtrl) {
            & $SbieCtrl /terminate:RootEnv 2>$null
          }
          Start-Sleep -Seconds 3

          $RootEnvPath = "C:\RootEnv\RootEnv"
          if (-not (Test-Path $RootEnvPath)) {
            Write-Host "No RootEnv directory found to persist."
            exit 0
          }

          # Check if there is anything inside RootEnv to save
          $ItemCount = (Get-ChildItem -Path $RootEnvPath -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "Total captured files in RootEnv: $ItemCount"

          if ($ItemCount -gt 0 -and $env:HF_TOKEN -and $env:HF_REPO) {
            Write-Host "Compressing RootEnv overlay layer (Zstandard multi-threaded)..."
            if (-not (Test-Path "C:\Temp")) { New-Item -ItemType Directory -Path "C:\Temp" -Force | Out-Null }
            
            python -c @"
          import zstandard as zstd, tarfile, os
          cctx = zstd.ZstdCompressor(level=3, threads=-1)
          with open('C:/Temp/rootenv.tar.zst', 'wb') as f_out:
              with cctx.stream_writer(f_out) as compressor:
                  with tarfile.open(fileobj=compressor, mode='w|') as tar:
                      tar.add('C:/RootEnv/RootEnv', arcname='')
          print('Zstandard compression finished. Size:', os.path.getsize('C:/Temp/rootenv.tar.zst'))
          "@

            Write-Host "Encrypting layer (AES-256-CBC PBKDF2)..."
            $OpenSSL = "C:\Program Files\Git\usr\bin\openssl.exe"
            if (-not (Test-Path $OpenSSL)) { $OpenSSL = "openssl" }
            & $OpenSSL enc -aes-256-cbc -pbkdf2 -pass "pass:$env:ENV_PASS" -in "C:\Temp\rootenv.tar.zst" -out "C:\Temp\rootenv.bin"
            Remove-Item -Force "C:\Temp\rootenv.tar.zst" -ErrorAction SilentlyContinue

            if (Test-Path "C:\Temp\rootenv.bin") {
              Write-Host "Uploading RootEnv snapshot to Hugging Face ($env:HF_REPO)..."
              $env:HF_HUB_ENABLE_HF_TRANSFER = "1"

              python -c @"
          import os
          from huggingface_hub import HfApi

          token = os.environ['HF_TOKEN']
          repo = os.environ['HF_REPO']
          api = HfApi(token=token)

          try:
              api.create_repo(repo_id=repo, repo_type='dataset', private=True, exist_ok=True)
          except Exception as e:
              print(f'Repo check: {e}')

          print(f'Uploading encrypted RootEnv overlay to Hugging Face ({repo})...')
          api.upload_file(
              path_or_fileobj='C:/Temp/rootenv.bin',
              path_in_repo='rootenv.bin',
              repo_id=repo,
              repo_type='dataset',
              commit_message='chore(checkpoint): update RootEnv overlay layer snapshot'
          )
          try:
              print('Collapsing dataset history to single commit (super_squash_history)...')
              api.super_squash_history(
                  repo_id=repo,
                  repo_type='dataset',
                  commit_message='chore(checkpoint): RootEnv baseline'
              )
              print('Dataset history squashed successfully.')
          except Exception as e:
              print(f'Squash notice: {e}')
          print('Hugging Face persistence complete.')
          "@
              Remove-Item -Force "C:\Temp\rootenv.bin" -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "RootEnv is empty or HF credentials not configured. Skipping upload."
          }

          $TailscaleBin = "C:\Program Files\Tailscale\tailscale.exe"
          if (Test-Path $TailscaleBin) {
            & $TailscaleBin logout 2>$null
          }
          Write-Host "Windows DevSpace shutdown and persistence routine completed."
